<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#120F2A">
<meta name="mobile-web-app-capable" content="yes">
<title>Plan de entrenamiento calistenia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: una columna alegre y deportiva; pestañas abajo en el teléfono, contenido máx. 760px. Look oscuro fijo, elegido a propósito. */
:root{
  --bg:#120F2A; --surface:#1D1842; --surface2:#28215A; --ink:#F7F5FF; --muted:#ABA5D3; --line:#352D6E;
  --accent:#C8F23C; --accent-ink:#172100; --accent-soft:#2C3A12;
  --hot:#FF5C8A; --hot-soft:#45193A;
  --blue:#4CC9F0; --blue-ink:#01202B; --blue-soft:#143A57; --wood:#FFB547;
  --good:#5BE39A; --warn:#FFD23F; --warn-soft:#3D340E;
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.7rem;line-height:1.05}
h3{font-size:1.25rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--accent)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)}
/* Week strip */
.weekbar{display:grid;grid-template-columns:repeat(52,1fr);gap:2px;margin:6px 0 4px}
.weekbar i{height:8px;border-radius:2px;background:var(--line)}
.weekbar i.dl{background:var(--muted);opacity:.55}
.weekbar i.past{background:var(--accent);opacity:.45}
.weekbar i.now{background:var(--accent);opacity:1}
/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{color:var(--good)}
/* Day nav */
.daynav{display:flex;align-items:center;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.datein{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{height:34px;padding:0 12px;font-size:.88rem}
/* Exercise block */
.ex{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ex:first-child{border-top:0;padding-top:0}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exname{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:1.05rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.presc{font-family:var(--f-display);font-weight:700;font-size:1.2rem;white-space:nowrap}
.last{font-size:.85rem;color:var(--muted)}
.field{width:100%;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 10px;min-width:0}
textarea.field{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.set{display:flex;flex-direction:column;gap:2px}
.set label{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.set input{height:44px;text-align:center;font-size:1.15rem;font-weight:600}
.band{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.86rem;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.band b{font-weight:700;color:var(--accent)}
.chip{align-self:flex-start;font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.feel{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.feel button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:.9rem;padding:0}
.feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:12px;border:2px solid var(--accent);background:transparent;font-weight:700;font-size:1.05rem;color:var(--accent);width:100%}
.done[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--f-display);font-size:1.4rem;color:var(--muted)}
details[open] summary::after{content:"–"}
ol.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.rounds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Plan */
.phase{display:flex;flex-direction:column;gap:10px}
.phase.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tmpl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.tmpl b{font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Technique list */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.extile{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px}
.extile svg{width:84px;height:60px;flex:none}
.extile .t{font-weight:600;line-height:1.2}
.extile .c{font-size:.78rem;color:var(--muted)}
/* Sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheetbox{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.figure{background:var(--bg);border-radius:12px;padding:8px}
.figure svg{width:100%;height:auto;display:block;max-height:260px}
.yt{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1}
.tile .l{font-size:.78rem;color:var(--muted);margin-top:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:18px;height:18px;border-radius:4px;background:transparent;border:1px solid var(--line)}
.heat i.done{background:var(--accent);border-color:var(--accent)}
.heat i.miss{background:var(--warn-soft);border-color:var(--warn-soft)}
.heat i.rest{border-style:dashed}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat i.pre{border-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%)}
.form3{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end}
.form3 label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.tablewrap{overflow-x:auto}
table.tests{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
table.tests th,table.tests td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}
table.tests th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
table.tests input{width:100%;min-width:70px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 6px}
.entries{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.entries div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}
/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-weight:600;font-size:.8rem;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.brand{font-weight:700;text-transform:none;font-size:1.75rem;line-height:1.02;letter-spacing:0}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display)}
.score .lbl{color:var(--blue);font-weight:700;letter-spacing:.12em;font-size:.95rem}
.score .big{font-size:3.4rem;font-weight:700;color:var(--hot);line-height:.8}
.score .of{color:var(--muted);font-weight:700;font-size:1.2rem}
.band{background:var(--blue-soft);border-color:transparent}
.band b{color:var(--blue)}
.chip{background:var(--blue-soft);color:var(--blue)}
.pill{background:var(--blue-soft)}
.weekbar i.past{background:var(--blue);opacity:.6}
.weekbar i.now{background:var(--accent);opacity:1}
.presc{color:var(--hot)}
.tile .v{color:var(--hot)}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:.74rem}
.figure{background:var(--surface2)}
.alt{color:var(--muted);font-size:.86em}
.meal{display:grid;grid-template-columns:52px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.meal:first-child{border-top:0;padding-top:0}
.meal .tm{font-family:var(--f-display);font-weight:700;color:var(--blue);font-size:1.15rem}
.opts{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.dinner{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.dinner:first-child{border-top:0;padding-top:0}
.taps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.taps button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.taps button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.taps.prot button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.wlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.witem{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;color:var(--ink)}
.witem svg{width:58px;height:42px;flex:none}
.witem .t{font-weight:700;line-height:1.2}
.witem .c{font-size:.8rem;color:var(--muted)}
.start{height:60px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:1.3rem;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.wk{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.wk .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wk h2{font-size:2rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.counter{display:grid;grid-template-columns:84px 1fr 84px;align-items:center;gap:10px}
.counter button{height:84px;border-radius:22px;border:0;background:var(--surface2);font-size:2.6rem;font-weight:800;color:var(--ink)}
.counter .val{text-align:center;font-family:var(--f-display);font-size:5.2rem;font-weight:700;line-height:1;color:var(--hot)}
.bigbtn{height:64px;border-radius:18px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;border:0;background:var(--accent);color:var(--accent-ink);width:100%}
.bigbtn.alt2{background:var(--surface2);color:var(--ink)}
.bigbtn.hot{background:var(--hot);color:#2A0012}
.ringwrap{display:grid;place-items:center;position:relative}
.ringwrap svg{width:min(260px,70vw);height:auto}
.ringwrap .rt{position:absolute;font-family:var(--f-display);font-size:4rem;font-weight:700}
.goal{background:var(--hot-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.goal b{color:var(--hot)}
.wk.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{background:var(--bg)}15%,55%{background:var(--accent)}35%,75%{background:var(--hot)}}
.sheet{z-index:40}
.sumrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem}
.cover{border-radius:16px;overflow:hidden;background:var(--surface)}
.cover img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.thumbs figure,.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg)}
.thumbs figcaption,.cmp figcaption{font-size:.78rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
select.field{appearance:auto}
.toastbox{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
@media (max-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}.tile .v{font-size:1.5rem}.form3{grid-template-columns:1fr 1fr}.form3 .full{grid-column:1/-1}.brand{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Plan de entrenamiento <span>calistenia</span></div>
      <div class="eyebrow" id="hdrSub" style="margin-top:6px">Fase 1 Base</div>
    </div>
    <div class="score" aria-label="Semana del plan"><span class="lbl">SEM</span><span class="big num" id="scoreWk">01</span><span class="of">/52</span></div>
  </header>
  <div class="status" id="status"><span class="dot" id="statusDot"></span><span id="statusTxt">Conectando…</span></div>
  <div class="weekbar" id="weekbar" aria-hidden="true"></div>
  <main id="view" style="margin-top:14px"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="7" r="3.5"/><circle cx="16" cy="7" r="3.5"/><path d="M8 11v10M16 11v10"/></svg>Hoy</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>Plan</button>
    <button data-tab="tecnica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 7v7M12 14l-4 7M12 14l4 7M6 10h12"/></svg>Técnica</button>
    <button data-tab="comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 2v8M4 2v5a3 3 0 0 0 6 0V2M7 10v12M17 2c-2 2-3 5-3 8h3v12"/></svg>Comida</button>
    <button data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
  </div>
</nav>

<div id="sheetRoot"></div>

<script>
/* ============ DATA: EJERCICIOS ============ */
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
const EX = {
 remo_anillas:{n:"Remo en anillas",c:"Tirón",pose:"row",
  steps:["Anillas a la altura del ombligo, agarre neutro (palmas enfrentadas).","Camina los pies hacia adelante hasta quedar inclinado con los brazos estirados. Cuerpo recto y glúteos apretados.","Jala las anillas hacia las costillas bajas con los codos cerca del cuerpo. Junta los omóplatos al final.","Baja en 3 segundos hasta estirar los brazos por completo."],
  err:["Cadera caída: el cuerpo se dobla en V.","Subir los hombros hacia las orejas.","Jalar solo con brazos, sin juntar omóplatos."],
  prog:"Más difícil: pies más adelante o anillas 5–10 cm más abajo. Siguiente: remo horizontal con pies en el escalón.",yt:"remo invertido en anillas técnica principiantes"},
 remo_horizontal:{n:"Remo horizontal",c:"Tirón",pose:"rowH",
  steps:["Baja las anillas para que el cuerpo quede casi horizontal.","Talones sobre el escalón, cuerpo recto de talones a cabeza.","Jala hasta que las anillas toquen el pecho bajo, codos pegados.","Baja en 3 s hasta estirar."],
  err:["Cadera que se hunde al final de la serie.","Rango corto: el pecho no llega a las anillas."],
  prog:"Pausa de 2 s arriba; después, remo con una pierna levantada.",yt:"ring row feet elevated technique"},
 remo_ancho:{n:"Remo agarre ancho",c:"Tirón",pose:"row",
  steps:["Mismo montaje del remo, con las anillas más abiertas que los hombros.","Jala hacia el pecho con los codos abiertos a unos 60° del cuerpo.","Junta los omóplatos arriba y baja en 3 s."],
  err:["Encoger el cuello.","Soltar la línea del cuerpo."],
  prog:"Pies más adelante; luego con pies en el escalón.",yt:"remo anillas agarre ancho técnica"},
 flexion_inclinada:{n:"Flexión inclinada",c:"Empuje",pose:"pushInc",
  steps:["Manos al ancho de hombros sobre una superficie firme (barra de la cocina).","Da un paso atrás hasta que el cuerpo quede recto de talones a cabeza. Aprieta abdomen y glúteos.","Baja en 2 s hasta que el pecho toque el borde, codos a unos 45° del cuerpo.","Empuja hasta estirar los brazos sin perder la línea."],
  err:["Codos abiertos en T: castiga el hombro.","Cadera hundida o levantada.","Rango corto: el pecho no llega al borde."],
  prog:"Barra de cocina (~90 cm) → mesa (~75 cm) → escalón a 30 cm → escalón a 20 cm → flexión en el suelo.",yt:"flexiones inclinadas técnica principiantes"},
 flexion:{n:"Flexión",c:"Empuje",pose:"push",
  steps:["Manos bajo los hombros, dedos abiertos.","Cuerpo como tabla: glúteos y abdomen apretados, mirada al suelo un poco adelante.","Baja en 2 s hasta dejar el pecho a un puño del suelo, codos a 45°.","Empuja el suelo lejos de ti hasta bloquear codos."],
  err:["Codos abiertos en T.","Cadera hundida.","Cabeza que baja antes que el pecho."],
  prog:"Si no llegas a 6: con rodillas apoyadas. Siguiente: pies elevados en el escalón.",yt:"flexiones técnica correcta principiantes"},
 flexion_declinada:{n:"Flexión con pies elevados",c:"Empuje",pose:"pushDec",
  steps:["Pies sobre el escalón, manos en el suelo al ancho de hombros.","Cuerpo recto: no dejes que la cadera se hunda.","Baja el pecho hacia un punto un poco delante de las manos.","Empuja hasta bloquear."],
  err:["Cadera hundida.","Codos abiertos."],
  prog:"Escalón más alto; luego flexión arquero en anillas.",yt:"flexiones declinadas técnica"},
 flexion_anillas:{n:"Flexión en anillas",c:"Empuje",pose:"pushRings",
  steps:["Anillas a 10–15 cm del suelo.","Posición de flexión con las anillas bajo los hombros; bloquea codos.","Baja controlando que las anillas no se abran.","Empuja y termina apretando las anillas hacia el cuerpo."],
  err:["Dejar que las anillas se separen.","Cadera hundida."],
  prog:"Pies elevados; luego arquero en anillas.",yt:"flexiones en anillas tutorial"},
 pike:{n:"Pike push-up",c:"Empuje",pose:"pike",
  steps:["Pies en el escalón (o en el suelo al inicio), manos al ancho de hombros.","Sube la cadera hasta formar una V invertida.","Dobla codos llevando la cabeza hacia adelante de las manos, formando un triángulo.","Empuja de regreso."],
  err:["Bajar la cadera: se vuelve flexión normal.","Codos muy abiertos."],
  prog:"Escalón más alto → pino con pies en la pared.",yt:"pike push up tutorial español"},
 sentadilla_caja:{n:"Sentadilla a caja",c:"Pierna",pose:"squatBox",
  steps:["Silla firme pegada a la pared. Pies al ancho de hombros, puntas un poco abiertas.","Lleva la cadera atrás y abajo como si fueras a sentarte; brazos al frente para balancear.","Roza la silla sin dejar caer el peso ni rebotar.","Sube empujando con todo el pie; rodillas en la dirección de las puntas."],
  err:["Rodillas hacia adentro.","Talones que se levantan.","Dejarse caer en la silla."],
  prog:"Pausa de 2 s rozando → sin silla → bajada de 3 s → sentadilla búlgara.",yt:"sentadilla a caja técnica principiantes"},
 sentadilla_pausa:{n:"Sentadilla con pausa",c:"Pierna",pose:"squat",
  steps:["Pies al ancho de hombros, puntas un poco abiertas.","Baja con la cadera atrás hasta que el muslo quede paralelo al piso.","Mantén 2 s abajo sin soltar el abdomen.","Sube empujando con todo el pie."],
  err:["Rodillas hacia adentro.","Relajarse abajo."],
  prog:"Fase 3: con mochila de 5–10 kg.",yt:"sentadilla con pausa técnica peso corporal"},
 sentadilla_una_caja:{n:"Sentadilla a una pierna a caja",c:"Pierna",pose:"pistolBox",
  steps:["Siéntate al borde del escalón o silla (30–40 cm) con una pierna estirada al frente.","Inclina el torso adelante y empuja con la pierna apoyada hasta ponerte de pie.","Baja lento (3 s) hasta rozar la caja con la misma pierna.","Agárrate de una anilla si te falta equilibrio."],
  err:["Rodilla hacia adentro.","Dejarse caer al final."],
  prog:"Caja más baja: 40 → 30 → 20 cm.",yt:"box pistol squat progresión"},
 bulgara:{n:"Sentadilla búlgara",c:"Pierna",pose:"bulg",
  steps:["Empeine del pie trasero sobre el escalón; pie delantero a un paso largo.","Baja en línea recta hasta que la rodilla de atrás casi toque el tapete.","Torso un poco inclinado adelante; la rodilla delantera sigue la punta del pie.","Sube empujando con el talón delantero."],
  err:["Pie delantero muy cerca del escalón.","Perder el equilibrio: agárrate de una anilla."],
  prog:"Mochila de 5–10 kg → 10–15 kg.",yt:"sentadilla búlgara técnica"},
 w_marcha:{n:"Marcha en el lugar",c:"Calentamiento",pose:"march",steps:["Marcha subiendo las rodillas a la altura de la cadera.","Mueve los brazos al ritmo, como si caminaras rápido.","Respira normal; es para subir la temperatura, no para cansarte."],err:["Ir tan rápido que te agites."],prog:"También puedes subir y bajar el escalón despacio.",yt:"marcha en el lugar calentamiento"},
 w_munecas:{n:"Círculos de muñeca",c:"Calentamiento",pose:"wrists",steps:["Entrelaza los dedos frente al pecho.","Haz círculos amplios con las muñecas: 10 hacia un lado y 10 hacia el otro.","Termina apoyando las palmas en el suelo y balanceándote suave adelante y atrás."],err:["Hacerlo rápido y sin rango."],prog:"Las muñecas trabajan mucho en flexiones y soporte: no te lo saltes.",yt:"calentamiento de muñecas calistenia"},
 w_hombros:{n:"Círculos de hombro",c:"Calentamiento",pose:"shoulders",steps:["Brazos estirados a los lados o al frente.","Haz círculos grandes: 10 hacia adelante y 10 hacia atrás.","Mantén el abdomen firme y sin arquear la espalda."],err:["Círculos pequeños y rápidos."],prog:"Aumenta el tamaño del círculo poco a poco.",yt:"círculos de hombro calentamiento"},
 w_gato:{n:"Gato-camello",c:"Calentamiento",pose:"catcow",steps:["En cuatro puntos: manos bajo los hombros, rodillas bajo la cadera.","Redondea la espalda metiendo la barbilla (gato).","Luego baja el abdomen y mira al frente (camello).","8 repeticiones lentas, respirando."],err:["Moverse solo con el cuello."],prog:"Hazlo más lento y con más rango.",yt:"gato camello ejercicio"},
 w_cadera:{n:"Círculos de cadera",c:"Calentamiento",pose:"hips",steps:["De pie, manos en la cintura, pies al ancho de hombros.","Dibuja círculos grandes con la cadera.","8 hacia cada lado."],err:["Mover los hombros en vez de la cadera."],prog:"Más amplitud cada semana.",yt:"círculos de cadera calentamiento"},
 w_sentadilla:{n:"Sentadilla profunda con apoyo",c:"Calentamiento",pose:"deepSquat",steps:["Agárrate de las anillas o del marco de una puerta.","Baja a la sentadilla más profunda que puedas con los talones en el piso.","Quédate 30 s, empujando las rodillas hacia afuera con los codos o los brazos."],err:["Levantar los talones."],prog:"Menos ayuda de los brazos con el tiempo.",yt:"sentadilla profunda movilidad asistida"},
 w_separacion:{n:"Separación de liga",c:"Calentamiento",pose:"pullApart",steps:["Liga de 13 mm con las manos al ancho de hombros, brazos estirados al frente.","Abre los brazos hasta que la liga toque el pecho.","Junta los omóplatos al final y regresa lento.","15 repeticiones."],err:["Doblar los codos.","Subir los hombros."],prog:"Agarre más cerrado para hacerlo más difícil.",yt:"band pull apart técnica"},
 w_lateral:{n:"Caminata lateral con mini-band",c:"Calentamiento",pose:"lateral",steps:["Mini-band arriba de las rodillas, media sentadilla.","Da pasos laterales cortos sin juntar los pies.","10 pasos a un lado y 10 al otro, empujando las rodillas hacia afuera."],err:["Rodillas hacia adentro.","Pararte derecho a mitad del ejercicio."],prog:"Una mini-band más dura.",yt:"caminata lateral con mini banda"},
 w_retraccion:{n:"Retracción escapular colgado",c:"Calentamiento",pose:"hang",steps:["Cuelga de las anillas con los pies apoyados.","Sin doblar los codos, baja y junta los omóplatos: el cuerpo sube unos centímetros.","Relaja y repite 8 veces."],err:["Doblar los codos.","Encoger los hombros."],prog:"Menos apoyo de los pies.",yt:"scapular pull ups principiantes"},
 c_pecho:{n:"Estiramiento de pecho en la puerta",c:"Estiramiento",pose:"chestStretch",steps:["Antebrazo apoyado en el marco de una puerta, codo a la altura del hombro.","Da un paso adelante con el pie del mismo lado hasta sentir el estiramiento en el pecho.","Mantén 30 s respirando y cambia de lado."],err:["Arquear la espalda baja."],prog:"Cambia la altura del codo para estirar otras fibras.",yt:"estiramiento de pecho en puerta"},
 c_nino:{n:"Postura del niño",c:"Estiramiento",pose:"child",steps:["De rodillas, siéntate sobre los talones.","Estira los brazos al frente en el tapete y lleva el pecho hacia el suelo.","Mantén 30 s respirando lento; sentirás los dorsales y la espalda baja."],err:["Aguantar la respiración."],prog:"Camina las manos a un lado para estirar más un dorsal.",yt:"postura del niño estiramiento"},
 c_flexor:{n:"Flexor de cadera en zancada",c:"Estiramiento",pose:"hipFlexor",steps:["Rodilla trasera en el tapete, pie delantero adelante.","Aprieta el glúteo de atrás y lleva la cadera un poco hacia adelante.","Sube los brazos para estirar más. 30 s por lado."],err:["Arquear la espalda en vez de apretar el glúteo."],prog:"Inclínate un poco hacia el lado contrario.",yt:"estiramiento flexor de cadera arrodillado"},
 c_isquios:{n:"Isquios con pie en el escalón",c:"Estiramiento",pose:"hamstring",steps:["Talón sobre el escalón, pierna estirada, punta hacia arriba.","Espalda recta: inclínate desde la cadera hasta sentir la parte de atrás del muslo.","30 s por lado, sin rebotar."],err:["Redondear la espalda para llegar más lejos."],prog:"Escalón un poco más alto.",yt:"estiramiento isquiotibiales pie elevado"},
 c_respira:{n:"Respiración boca arriba",c:"Estiramiento",pose:"breathe",steps:["Boca arriba, rodillas dobladas, manos en el abdomen.","Inhala 4 s por la nariz inflando el abdomen.","Exhala 6 s lento. Repite 1 minuto."],err:["Respirar solo con el pecho."],prog:"Alarga la exhalación a 8 s.",yt:"respiración diafragmática principiantes"},
 zancada:{n:"Zancada estática con apoyo",c:"Pierna",pose:"lunge",
  steps:["Párate junto a las anillas (a la altura de la cadera) y agarra una con la mano del lado de adentro.","Da un paso largo: pie de adelante completo en el piso, talón de atrás levantado.","Baja en línea recta hasta que la rodilla de atrás casi toque el tapete; torso derecho.","Sube empujando con el talón delantero. Haz todas las repeticiones de una pierna y cambia."],
  err:["Paso muy corto: la rodilla delantera se va muy adelante de la punta.","Rodilla delantera hacia adentro.","Jalarte con la anilla: solo es para el equilibrio."],
  prog:"Soltar la anilla → bajada de 3 s → sentadilla búlgara (fase 2).",yt:"zancada estática split squat técnica principiantes"},
 step_up:{n:"Step-up al escalón",c:"Pierna",pose:"step",
  steps:["Pie completo sobre el escalón.","Inclina el torso un poco y sube empujando solo con esa pierna.","Párate completo arriba y baja controlado.","Haz todas las repeticiones de una pierna y cambia."],
  err:["Impulsarte con la pierna de abajo.","Rodilla hacia adentro."],
  prog:"Altura 15–20 → 25 → 30 cm; luego con mochila.",yt:"step up ejercicio técnica"},
 colgado:{n:"Colgado activo",c:"Tirón",pose:"hang",
  steps:["Anillas altas; escalón debajo si lo necesitas.","Agarra fuerte y descarga en las manos todo el peso que puedas.","Hombros lejos de las orejas: omóplatos abajo.","Respira normal y mantén el abdomen firme."],
  err:["Hombros encogidos (colgado pasivo).","Balancearse."],
  prog:"Menos apoyo de pies, hasta colgarte completo 30 s.",yt:"colgado activo escapular principiantes"},
 dominada_negativa:{n:"Dominada negativa",c:"Tirón",pose:"pullNeg",
  steps:["Escalón bajo las anillas altas.","Sube con ayuda de las piernas hasta tener la barbilla arriba de las manos.","Quita los pies y baja en 4–5 s de forma continua hasta estirar los brazos.","Vuelve a subir con los pies: no hagas la subida con brazos."],
  err:["Caer rápido en la última mitad.","Soltar la tensión de hombros abajo."],
  prog:"Negativas de 5 s, 3×5 → dominada con liga más delgada.",yt:"dominadas negativas técnica"},
 dominada_liga:{n:"Dominada asistida con liga",c:"Tirón",pose:"pullBand",
  steps:["Pasa la liga por ambas anillas (o por la viga) y mete una rodilla o un pie.","Desde brazos estirados, baja primero los hombros.","Jala hasta que la barbilla pase las manos; codos hacia las costillas.","Baja controlado en 2–3 s."],
  err:["Media repetición: no estirar abajo.","Patear para subir."],
  prog:"Liga 44 → 32 → 21 mm → dominada estricta.",yt:"dominadas con banda elástica asistida técnica"},
 dominada:{n:"Dominada estricta",c:"Tirón",pose:"pullUp",
  steps:["Cuelga con brazos estirados y cuerpo quieto.","Baja los hombros y jala llevando los codos hacia las costillas.","Barbilla arriba de las manos, sin estirar el cuello.","Baja controlado hasta estirar."],
  err:["Balanceo (kipping).","No estirar abajo."],
  prog:"3×5 → pausa arriba → agarre supino.",yt:"cómo hacer tu primera dominada"},
 jalon_liga:{n:"Jalón con liga",c:"Tirón",pose:"pulldown",
  steps:["Pasa tu liga por la viga o la anilla alta (el grosor aparece arriba).","De rodillas, agárrala con ambas manos arriba, brazos estirados.","Baja primero los hombros y luego lleva los codos hacia las costillas.","Regresa lento."],
  err:["Arquear la espalda para jalar.","Encoger hombros."],
  prog:"Liga más gruesa o arrodíllate más atrás.",yt:"jalón al pecho con banda elástica"},
 soporte:{n:"Soporte en anillas",c:"Empuje",pose:"support",
  steps:["Anillas a la altura de la cadera.","Apóyate con los brazos estirados y bloqueados, anillas pegadas a los costados.","Pies en el piso ligeramente atrás para quitar peso; hombros abajo.","Si las anillas tiemblan es normal: aprieta y respira."],
  err:["Codos doblados.","Hombros encogidos."],
  prog:"Menos apoyo de pies → 30 s sin pies.",yt:"ring support hold principiantes"},
 fondos_asistidos:{n:"Fondos en anillas asistidos",c:"Empuje",pose:"dipAssist",
  steps:["Anillas a la altura de la cadera, pies en el piso delante de ti.","Desde el soporte, baja inclinando un poco el torso hasta que los codos lleguen a 90°.","Usa las piernas solo lo necesario.","Sube hasta bloquear."],
  err:["Bajar demasiado profundo al inicio.","Anillas que se separan del cuerpo."],
  prog:"Menos piernas → liga bajo las rodillas → fondos libres.",yt:"fondos en anillas asistidos principiantes"},
 fondos_anillas:{n:"Fondos en anillas",c:"Empuje",pose:"dip",
  steps:["Súbete al soporte con brazos bloqueados.","Baja inclinando el torso hasta codos a 90°, anillas pegadas.","Sube hasta bloquear sin balancearte."],
  err:["Anillas abiertas.","Hombros hacia las orejas abajo."],
  prog:"3×5 → rotar las anillas hacia afuera arriba.",yt:"ring dips tutorial"},
 press_liga:{n:"Press de hombros con liga",c:"Empuje",pose:"press",
  steps:["Párate sobre la liga, pies al ancho de cadera.","Agárrala a la altura de los hombros.","Empuja arriba hasta estirar los brazos, bíceps junto a las orejas.","Abdomen y glúteos apretados: sin arquear la espalda."],
  err:["Arquear la zona lumbar.","Rango corto."],
  prog:"Liga más gruesa → pike push-up.",yt:"press militar con banda elástica"},
 plancha:{n:"Plancha en antebrazos",c:"Core",pose:"plank",
  steps:["Codos bajo los hombros, antebrazos paralelos.","Glúteos apretados, costillas hacia adentro.","Cuerpo en línea recta, mirada al suelo.","Respira sin soltar el abdomen."],
  err:["Cadera hundida.","Cadera muy alta."],
  prog:"Con rodillas → completa 45 s → hollow body.",yt:"plancha abdominal técnica correcta"},
 plancha_lateral:{n:"Plancha lateral",c:"Core",pose:"sidePlank",
  steps:["Codo bajo el hombro, cuerpo de lado.","Levanta la cadera hasta formar una línea recta.","Rodillas apoyadas si hace falta.","Mantén sin rotar el torso."],
  err:["Cadera caída.","Hombro hacia la oreja."],
  prog:"Rodillas → pies → 30 s por lado.",yt:"plancha lateral técnica"},
 puente:{n:"Puente de glúteo",c:"Pierna",pose:"bridge",
  steps:["Boca arriba, rodillas dobladas, pies al ancho de cadera; mini-band arriba de las rodillas.","Sube la cadera empujando con los talones.","Empuja las rodillas hacia afuera contra la liga; 2 s arriba apretando glúteos.","Baja lento."],
  err:["Arquear la espalda en lugar de apretar glúteos.","Rodillas hacia adentro."],
  prog:"Puente a una pierna.",yt:"puente de glúteo con banda técnica"},
 puente_una:{n:"Puente a una pierna",c:"Pierna",pose:"bridge1",
  steps:["Igual que el puente, con una pierna estirada al aire.","Sube empujando con el talón apoyado.","Cadera nivelada: que no se caiga hacia un lado.","Baja lento."],
  err:["Girar la cadera."],prog:"Pausa de 3 s arriba.",yt:"puente de glúteo a una pierna"},
 peso_muerto_liga:{n:"Peso muerto con liga",c:"Pierna",pose:"hinge",
  steps:["Párate sobre la liga y agárrala con ambas manos.","Rodillas un poco dobladas; lleva la cadera atrás con la espalda recta.","Baja hasta sentir estiramiento en la parte de atrás del muslo.","Sube apretando glúteos."],
  err:["Redondear la espalda.","Convertirlo en sentadilla."],
  prog:"Liga más gruesa → peso muerto a una pierna.",yt:"peso muerto con banda elástica técnica"},
 rdl_una:{n:"Peso muerto a una pierna",c:"Pierna",pose:"hinge1",
  steps:["De pie en una pierna, mochila en la mano contraria.","Inclina el torso mientras la pierna libre sube atrás en línea con la espalda.","Cadera cuadrada al piso.","Sube apretando el glúteo."],
  err:["Girar la cadera.","Doblar mucho la rodilla."],
  prog:"Más peso en la mochila. Agárrate de una anilla si hace falta.",yt:"peso muerto rumano a una pierna técnica"},
 curl_femoral:{n:"Curl femoral deslizante",c:"Pierna",pose:"hamCurl",
  steps:["Boca arriba, talones sobre una toalla en piso liso.","Sube la cadera.","Jala los talones hacia los glúteos sin bajar la cadera.","Estira lento."],
  err:["Bajar la cadera al jalar."],
  prog:"Solo la bajada lenta → completo → a una pierna.",yt:"curl femoral deslizante toalla"},
 curl_femoral_una:{n:"Curl femoral a una pierna",c:"Pierna",pose:"hamCurl1",
  steps:["Igual que el curl deslizante, con una pierna levantada.","Cadera arriba todo el tiempo.","Jala con el talón apoyado y estira lento."],
  err:["Cadera caída."],prog:"Más lento en la bajada (4 s).",yt:"single leg sliding hamstring curl"},
 dead_bug:{n:"Dead bug",c:"Core",pose:"deadbug",
  steps:["Boca arriba, brazos al techo, rodillas a 90°.","Pega la zona lumbar al suelo y mantenla así todo el tiempo.","Estira un brazo atrás y la pierna contraria al frente, lento.","Regresa y cambia de lado."],
  err:["Zona lumbar despegada.","Ir rápido."],
  prog:"Piernas más estiradas → hollow body.",yt:"dead bug ejercicio técnica"},
 hollow:{n:"Hollow body (rodillas dobladas)",c:"Core",pose:"hollow",
  steps:["Boca arriba, zona lumbar pegada al suelo.","Levanta hombros y rodillas, brazos hacia los pies.","Mantén respirando."],
  err:["Lumbar despegada."],prog:"Estira las piernas poco a poco.",yt:"hollow body hold principiantes"},
 rodillas_pecho:{n:"Rodillas al pecho colgado",c:"Core",pose:"kneeRaise",
  steps:["Cuelga de las anillas con los hombros activos.","Sube las rodillas al pecho sin balancearte.","Baja lento."],
  err:["Balanceo.","Hombros encogidos."],prog:"Más repeticiones → tuck L-sit.",yt:"elevación de rodillas colgado técnica"},
 face_pull:{n:"Face pull",c:"Tirón",pose:"facePull",
  steps:["Liga atada a una anilla a la altura de la cara (o anillas a esa altura).","Jala hacia la frente abriendo los codos a la altura de los hombros.","Al final rota las manos hacia atrás, como mostrando bíceps.","Regresa lento."],
  err:["Codos abajo.","Usar impulso."],prog:"Pausa de 2 s atrás.",yt:"face pull con banda elástica"},
 curl_anillas:{n:"Curl de bíceps en anillas",c:"Tirón",pose:"curl",
  steps:["Inclínate hacia atrás con las anillas al frente, palmas arriba.","Codos fijos apuntando a las anillas.","Lleva las manos hacia la frente doblando solo los codos.","Baja lento."],
  err:["Mover los codos.","Cadera caída."],prog:"Más inclinado.",yt:"curl de bíceps en anillas"},
 extension_triceps:{n:"Extensión de tríceps en anillas",c:"Empuje",pose:"triExt",
  steps:["Anillas a la altura del pecho; inclínate hacia adelante con los brazos estirados.","Dobla solo los codos llevando la frente hacia las anillas.","Empuja hasta estirar. Cuerpo recto."],
  err:["Abrir los codos.","Doblar la cadera."],prog:"Pies más atrás.",yt:"extensión de tríceps en anillas"},
 pantorrillas:{n:"Pantorrillas en escalón",c:"Pierna",pose:"calf",
  steps:["Puntas en el borde del escalón, talones fuera.","Baja los talones lento.","Sube de puntas lo más alto posible, 1 s arriba.","Agárrate de algo para el equilibrio."],
  err:["Rebotar abajo."],prog:"A una pierna.",yt:"elevación de talones en escalón"},
 pantorrilla_una:{n:"Pantorrilla a una pierna",c:"Pierna",pose:"calf1",
  steps:["Igual que en el escalón, apoyado en una sola pierna.","Rango completo, 1 s arriba."],
  err:["Rebotar abajo."],prog:"Mochila en la mano.",yt:"single leg calf raise step"},
 tuck_lsit:{n:"Tuck L-sit",c:"Habilidad",pose:"tuckL",
  steps:["Manos en el escalón o en anillas bajas, a los costados de la cadera.","Empuja el apoyo, bloquea codos y baja los hombros.","Levanta los pies con las rodillas al pecho.","Mantén 5–10 s."],
  err:["Hombros encogidos.","Codos doblados."],prog:"Más segundos → una pierna estirada.",yt:"tuck l sit tutorial principiantes"},

function vec(a,l){const r=a*Math.PI/180;return[Math.sin(r)*l,-Math.cos(r)*l]}
function add(o,a,l){const d=vec(a,l);return[o[0]+d[0],o[1]+d[1]]}
function fk(p){
  if(p.J) return JSON.parse(JSON.stringify(p.J));
  const hip=[p.x,p.y??70],J={hip};
  J.neck=add(hip,p.t,LEN.t);J.head=add(J.neck,p.hd??p.t,LEN.hd);
  J.elbow=add(J.neck,p.ua,LEN.ua);J.wrist=add(J.elbow,p.fa,LEN.fa);
  J.knee=add(hip,p.th,LEN.th);J.ankle=add(J.knee,p.sh,LEN.sh);J.toe=add(J.ankle,p.ft??90,LEN.ft);
  if(p.th2!=null){J.knee2=add(hip,p.th2,LEN.th);J.ankle2=add(J.knee2,p.sh2,LEN.sh);J.toe2=add(J.ankle2,p.ft2??90,LEN.ft)}
  if(p.ua2!=null){J.elbow2=add(J.neck,p.ua2,LEN.ua);J.wrist2=add(J.elbow2,p.fa2,LEN.fa)}
  if(p.y==null){let m=-1e9;for(const k in J){const v=J[k][1]+(k==="head"?7:0);if(v>m)m=v}const d=128-m;for(const k in J)J[k][1]+=d}
  return J;
}

function lerpSpec(a,b,t){const o={};const ks=new Set([...Object.keys(a),...Object.keys(b)]);const def=(p,k)=>p[k]!=null?p[k]:(k==="hd"?p.t:(k==="ft"||k==="ft2")?90:null);
  for(const k of ks){if(k==="y"){if(a.y!=null&&b.y!=null)o.y=a.y+(b.y-a.y)*t;continue}const va=def(a,k),vb=def(b,k);o[k]=(va==null||vb==null)?(va??vb):va+(vb-va)*t}return o}
function lerpJ(a,b,t){const o={};for(const k in a){const bb=b[k]||a[k];o[k]=[a[k][0]+(bb[0]-a[k][0])*t,a[k][1]+(bb[1]-a[k][1])*t]}return o}
const f1=n=>Math.round(n*10)/10;
function pl(pts){return pts.map(p=>f1(p[0])+","+f1(p[1])).join(" ")}
function drawFigure(key,J,anchor){
  const P=POSE[key];let s="";

    else if(pr==="handBlock"){const w=J.wrist;s+=`<rect x="${f1(w[0]-16)}" y="${f1(w[1]+2)}" width="34" height="${f1(Math.max(0,128-w[1]))}" rx="2" fill="var(--line)"/>`}
    else if(pr==="footBlock"){const y=Math.max(J.ankle[1],J.toe[1])+2;const x=Math.min(J.ankle[0],J.toe[0])-8;s+=`<rect x="${f1(x)}" y="${f1(y)}" width="30" height="${f1(Math.max(0,130-y))}" rx="2" fill="var(--line)"/>`}

}
function figureSVG(key,phase){const PJ=poseJoints(key);const J=phase&&PJ.e?PJ.e:PJ.s;return `<svg viewBox="-10 -14 220 150" role="img" aria-label="Diagrama del ejercicio">${drawFigure(key,J,PJ.s.wrist)}</svg>`}

function animate(el,key,slot){slot=slot||"sheet";

  RAFS[slot]=requestAnimationFrame(step);
}

function fmt(str){const me=prof(),other=state.settings.partnerName||(me==="p1"?"Perfil 2":"Perfil 1");return esc(str).replace(/\{([^|}]*)\|([^}]*)\}/g,(m,a,b)=>{const mine=me==="p1"?a:b,oth=me==="p1"?b:a;return `<b>${mine}</b> <span class="alt">(${other}: ${oth})</span>`})}
function ritmo(){const e=[...(state.body.entries||[])].filter(x=>x.w).sort((a,b)=>a.date<b.date?-1:1);if(e.length<2)return null;const last=e[e.length-1];let first=e[0];for(const x of e){if(diffDays(last.date,x.date)<=35){first=x;break}}const days=diffDays(last.date,first.date);if(days<7)return null;return (last.w-first.w)/days*7}

const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const nice=s=>{const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2)};

const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const r=indexedDB.open("entreno_fotos",1);r.onupgradeneeded=()=>{r.result.createObjectStore("fotos",{keyPath:"id"})};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out=[];const rq=db.transaction("fotos").objectStore("fotos").openCursor();rq.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})},
  async put(o){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("fotos","readwrite");tx.objectStore("fotos").put(o);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  async del(id){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("fotos","readwrite");tx.objectStore("fotos").delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};

function weekSummary(){const t=today(),mon=addDays(t,-((parse(t).getDay()+6)%7));let done=0,plan=0;const ups=new Set();
  for(let i=0;i<7;i++){const d=addDays(mon,i);if(d<state.settings.startDate||d>t)continue;const p=dayPlan(d);if(p.s.k!=="rest"){plan++;if(state.logs[d]&&state.logs[d].done)done++}
    const l=state.logs[d];if(l&&l.ex)for(const id in l.ex){const sum=a=>(a||[]).reduce((s,v)=>s+(parseFloat(v)||0),0);const prev=history(id,d)[0];if(prev&&sum(l.ex[id].r)>sum(prev.r))ups.add(EX[id].n)}}

  const base=(k,last)=>{if(!last)return null;const f=e.find(x=>x[k]&&diffDays(last.date,x.date)<=35);return f&&f!==last?(last[k]-f[k]):null};
  const w=weekOf(t),nm=state.settings.name||"";let txt=`💪 ${nm?nm+" · ":""}Semana ${Math.max(1,Math.min(52,w))} de 52 · Fase ${state.settings.phase}\nSesiones esta semana: ${done} de ${plan}`;

/* ============ LÓGICA DEL PLAN ============ */
function weekOf(date){const d=diffDays(date,state.settings.startDate);return Math.floor(d/7)+1}
function suggestedPhase(w){return Math.min(4,Math.max(1,Math.ceil(w/13)))}
function dayPlan(date){
  const w=weekOf(date),wk=Math.max(1,w),phase=state.settings.phase||1,dow=parse(date).getDay();
  let key=WEEK[phase][dow];
  if(key==="F"){const odd=wk%2===1;key=(dow===3)?(odd?"p1B":"p1A"):(odd?"p1A":"p1B")}
  let s=S[key];
  if(prof()==="p2"&&phase===1&&(key==="p1A"||key==="p1B"))s={...s,it:[...s.it,key==="p1A"?["curl_anillas",2,"10–15",null,"Extra de brazos: anillas altas, casi de pie"]:["extension_triceps",2,"10–15",null,"Extra de brazos: anillas altas, casi de pie"]]};
  return {w,wk,phase,dow,key,s,deload:DELOAD.includes(wk),before:w<1};
}
function setsFor(base,plan){let n=base;if(plan.phase===1&&plan.wk<=2)n=Math.min(n,2);if(plan.deload)n=Math.ceil(n/2);return n}
function topOf(r){const m=String(r).match(/\d+/g);return m?Number(m[m.length-1]):null}
function history(exId,before){
  const out=[];const dates=Object.keys(state.logs).filter(d=>d<before).sort().reverse();
  for(const d of dates){const e=state.logs[d].ex&&state.logs[d].ex[exId];if(e&&e.r&&e.r.some(x=>String(x).trim()!==""))out.push({d,...e});if(out.length>=2)break}
  return out;
}
function readyToProgress(exId,before,reps,nsets){
  const h=history(exId,before),top=topOf(reps);if(h.length<2||!top)return false;
  return h.every(e=>{const vals=e.r.map(x=>parseFloat(x)).filter(x=>!isNaN(x));return vals.length>=nsets&&vals.every(v=>v>=top)});
}
function whereUsed(){const m={};for(const ph of [1,2,3,4]){const keys=new Set(Object.values(WEEK[ph]).flatMap(k=>k==="F"?["p1A","p1B"]:[k]));for(const k of keys){const s=S[k];if(!s.it)continue;for(const [id] of s.it){(m[id]=m[id]||new Set()).add("Fase "+ph+" · "+s.n)}}}return m}
const WHERE=whereUsed();

function bindCharts(){
  const ent=[...(state.body.entries||[])].sort((a,b)=>a.date<b.date?-1:1);
  document.querySelectorAll("[data-chart]").forEach(box=>{
    const k=box.dataset.chart,pts=ent.filter(e=>e[k]).map(e=>({d:e.date,v:Number(e[k])}));
    const W=640,H=200,L=44,R=16,T=14,B=28;
    const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const padv=Math.max(1,(hi-lo)*.15);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
    const t0=parse(pts[0].d).getTime(),t1=Math.max(t0+864e5*14,parse(pts[pts.length-1].d).getTime());
    const X=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
    const ticks=[];const step=Math.max(1,Math.ceil((hi-lo)/4));for(let v=lo;v<=hi;v+=step)ticks.push(v);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k==="w"?"Peso":"Cintura"} en el tiempo">`;
    for(const v of ticks)s+=`<line x1="${L}" x2="${W-R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${f1(Y(v)+4)}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
    s+=`<text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${nice(pts[0].d)}</text>`;
    if(pts.length>1)s+=`<text x="${W-R}" y="${H-8}" font-size="12" text-anchor="end" fill="var(--muted)">${nice(pts[pts.length-1].d)}</text>`;
    const path=pts.map((p,i)=>(i?"L":"M")+f1(X(p.d))+","+f1(Y(p.v))).join(" ");
    if(pts.length>1)s+=`<path d="${path} L${f1(X(pts[pts.length-1].d))},${H-B} L${f1(X(pts[0].d))},${H-B} Z" fill="var(--accent)" opacity=".10"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${f1(X(p.d))}" cy="${f1(Y(p.v))}" r="${last?6:4.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`});
    const lp=pts[pts.length-1];s+=`<text x="${f1(Math.min(W-R-4,X(lp.d)))}" y="${f1(Y(lp.v)-12)}" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">${lp.v}</text>`;
    s+=`</svg><div class="tip" hidden></div>`;box.innerHTML=s;
    const svg=box.querySelector("svg"),tip=box.querySelector(".tip");
    const move=ev=>{const r=svg.getBoundingClientRect();const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;const sx=cx/r.width*W;let best=pts[0];for(const p of pts)if(Math.abs(X(p.d)-sx)<Math.abs(X(best.d)-sx))best=p;
      tip.hidden=false;tip.textContent=niceY(best.d)+": "+best.v+(k==="w"?" kg":" cm");tip.style.left=(X(best.d)/W*r.width)+"px";tip.style.top=(Y(best.v)/H*r.height)+"px"};
    svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",()=>tip.hidden=true);
  });
}

  if(a==="skip"){const n=W.rest.next;W.rest=null;W.i=n;enterStep();renderW();return}
  if(a==="wustart"){W.autoWu=true;W.work={end:Date.now()+st.sec*1000,total:st.sec};renderW();announce();return}
  if(a==="pause"){if(!W.work)return;if(W.work.paused!=null){W.work.end=Date.now()+W.work.paused*1000;W.work.paused=null}else{W.work.paused=Math.max(0,(W.work.end-Date.now())/1000)}renderW();return}
  if(a==="skiplist"){let j=W.i;while(W.steps[j]&&W.steps[j].k==="wu"&&W.steps[j].list===st.list)j++;go(j);return}
  if(a==="clearset"){const x=stepLog(st);if(x.r)x.r[st.j]="";save("log-"+W.d);enterStep();renderW();return}
  if(a==="warmdone"||a==="cooldone"){const l=getLog(W.d);l[a==="warmdone"?"warm":"cool"]=true;save("log-"+W.d);go(W.i+1);return}
  if(a==="cwstart"){W.auto=true;const R=rng(st.reps);W.work={end:Date.now()+R.hi*1000,total:R.hi};renderW();say("Adelante. "+R.hi+" segundos.");return}
  if(a==="cwdone"){W.auto=true;finishCw();return}
  if(a==="feel"){const l=getLog(W.d);const v=Number(b.dataset.v);l.feel=l.feel===v?null:v;save("log-"+W.d);renderW();return}
  if(a==="finish"){if(sumMissing().length){W.sumErr=true;renderW();say("Te faltan series por anotar.");return}const l=getLog(W.d);l.done=true;l.plan=W.p.key;save("log-"+W.d,true);clearInterval(W.tick);W=null;const el=document.getElementById("wk");if(el)el.hidden=true;document.body.style.overflow="";render();return}
}

/* ============ EVENTOS ============ */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;ui.tab=b.dataset.tab;try{localStorage.setItem("ba_ui",JSON.stringify({tab:ui.tab}))}catch(_){}render();window.scrollTo(0,0)});
document.getElementById("sheetRoot").addEventListener("click",e=>{if(e.target.closest('[data-act="close"]'))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const view=document.getElementById("view");
view.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-ex]");if(!t)return;
  if(t.dataset.ex){openSheet(t.dataset.ex);return}
  const a=t.dataset.act;const d=ui.date;
  if(a==="prev"){ui.date=addDays(d,-1);render();return}
  if(a==="next"){ui.date=addDays(d,1);render();return}
  if(a==="today"){ui.date=today();render();return}
  if(a==="testVoice"){initAudio();testVoice();return}
  if(a==="backup"){backup();return}
  if(a==="doRestore"){const d=ui.restore;ui.restore=null;if(d.photos)restorePhotos(d.photos);for(const [k,v] of Object.entries(d.slots)){try{localStorage.setItem(KEY(k),JSON.stringify(normalize(v,k)))}catch(e){}}const sl=d.slots[state.slot]?state.slot:(d.active||Object.keys(d.slots)[0]);activeSlot=null;switchSlot(sl);toast("Respaldo restaurado.");return}
  if(a==="cancelRestore"){ui.restore=null;render();return}
  if(a==="shareWeek"){shareWeek();return}
  if(a==="delCover"){IDB.del("cover").then(()=>{toast("Foto de portada quitada.")});return}
  if(a==="showPhotos"){ui.showPhotos=true;fillPhotos();return}
  if(a==="hidePhotos"){ui.showPhotos=false;fillPhotos();return}
  if(t.dataset.cmppose){ui.cmpPose=t.dataset.cmppose;fillPhotos();return}
  if(t.dataset.delphoto){if(ui.confirmDel!==t.dataset.delphoto){ui.confirmDel=t.dataset.delphoto;t.textContent="¿Seguro? Toca otra vez";return}ui.confirmDel=null;IDB.del(t.dataset.delphoto).then(fillPhotos);return}
  if(a==="viewMine"){ui.viewPartner=false;render();return}
  if(a==="viewPartner"){ui.viewPartner=true;render();return}
  if(a==="startW"){startWorkout();return}
  if(a==="guideWarm"){startWorkout("warm");return}
  if(a==="guideCool"){startWorkout("cool");return}
  if(t.dataset.clearex){const l=getLog(d);if(l.ex)delete l.ex[t.dataset.clearex];save("log-"+d,true);render();return}
  if(a==="goprog"){ui.tab="progreso";render();window.scrollTo(0,0);return}
  if(a==="done"){const l=getLog(d);l.done=!l.done;l.plan=dayPlan(d).key;save("log-"+d,true);render();return}
  if(t.dataset.feel){const l=getLog(d);const n=Number(t.dataset.feel);l.feel=l.feel===n?null:n;save("log-"+d);render();return}
  if(t.dataset.round!=null){const l=getLog(d);l.rounds=l.rounds||[];const i=Number(t.dataset.round);l.rounds[i]=!l.rounds[i];for(let j=0;j<l.rounds.length;j++)l.rounds[j]=!!l.rounds[j];save("log-"+d);render();return}
  if(t.dataset.prof){switchSlot(t.dataset.prof);return}
  if(t.dataset.fp!=null||t.dataset.fa!=null||t.dataset.fv!=null){const l=getLog(d);l.food=l.food||{};const k=t.dataset.fp!=null?"p":t.dataset.fa!=null?"a":"v";const i=Number(t.dataset.fp??t.dataset.fa??t.dataset.fv);const arr=Array.isArray(l.food[k])?l.food[k].slice():[];arr[i]=!arr[i];for(let j=0;j<arr.length;j++)arr[j]=!!arr[j];l.food[k]=arr;save("log-"+d);render();return}
  if(t.dataset.phase){state.settings.phase=Number(t.dataset.phase);save("settings",true);render();return}
  if(t.dataset.cat){ui.cat=t.dataset.cat;render();return}
  if(a==="addBody"){const date=document.getElementById("bDate").value,w=parseFloat(document.getElementById("bW").value),c=parseFloat(document.getElementById("bC").value);
    if(!date||(isNaN(w)&&isNaN(c)))return;const list=(state.body.entries||[]).filter(x=>x.date!==date);list.push({date,w:isNaN(w)?null:w,c:isNaN(c)?null:c});state.body.entries=list;save("body",true);render();return}
  if(t.dataset.delbody){state.body.entries=(state.body.entries||[]).filter(x=>x.date!==t.dataset.delbody);save("body",true);render();return}
});
view.addEventListener("input",e=>{
  const t=e.target,d=ui.date;
  if(t.dataset.exV){const l=getLog(d);l.ex=l.ex||{};const x=l.ex[t.dataset.exV]=l.ex[t.dataset.exV]||{r:[]};x.v=t.value;save("log-"+d);return}
  if(t.dataset.exR){const l=getLog(d);l.ex=l.ex||{};const id=t.dataset.exR;const x=l.ex[id]=l.ex[id]||{r:[]};if(x.v==null){const vi=document.getElementById("v-"+id);if(vi&&vi.value)x.v=vi.value}x.r=x.r||[];x.r[Number(t.dataset.i)]=t.value;for(let j=0;j<x.r.length;j++)if(x.r[j]==null)x.r[j]="";save("log-"+d);return}
  if(t.dataset.f==="note"||t.dataset.f==="walkMin"){const l=getLog(d);l[t.dataset.f]=t.value;save("log-"+d);return}
  if(t.id==="pname"){state.settings.name=t.value;save("settings");renderHeader();return}
  if(t.id==="ppname"){state.settings.partnerName=t.value;save("settings");return}
  if(t.dataset.test){const c=t.dataset.test;state.tests[c]=state.tests[c]||{};state.tests[c][t.dataset.k]=t.value;save("tests");return}
  if(t.id==="texq"){ui.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById("texq");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}return}
});
view.addEventListener("change",e=>{
  const t=e.target,d=ui.date;
  if(t.id==="coverFile"){const f=t.files&&t.files[0];t.value="";if(f)setCover(f).then(()=>render());return}
  if(t.id==="phFile"){const f=t.files&&t.files[0];t.value="";if(f)addPhoto(f).then(()=>render());return}
  if(t.id==="cmpA"){ui.cmpA=t.value;fillPhotos();return}
  if(t.id==="cmpB"){ui.cmpB=t.value;fillPhotos();return}
  if(t.id==="restoreFile"){readFile(t,d=>{ui.restore=d;render()});return}
  if(t.id==="partnerFile"){readFile(t,d=>{loadPartner(d);render()});return}
  if(t.id==="dateSel"&&t.value){ui.date=t.value;render();return}
  if(t.id==="startDate"&&t.value){state.settings.startDate=t.value;save("settings",true);render();return}
  if(t.dataset.ft){const l=getLog(d);l.food=l.food||{};l.food[t.dataset.ft]=t.checked;save("log-"+d);return}
  if(t.dataset.f==="warm"||t.dataset.f==="cool"){const l=getLog(d);l[t.dataset.f]=t.checked;save("log-"+d);render();return}
  if(t.dataset.crit){const n=t.dataset.crit;const arr=(state.settings.criteria[n]||[]).slice();arr[Number(t.dataset.j)]=t.checked;for(let j=0;j<arr.length;j++)arr[j]=!!arr[j];state.settings.criteria[n]=arr;save("settings",true);render();return}
});

/* ============ ARRANQUE ============ */
initStore();
</script>
