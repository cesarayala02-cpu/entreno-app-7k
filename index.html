<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#120F2A">
<meta name="mobile-web-app-capable" content="yes">
<title>Plan de entrenamiento calistenia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: una columna alegre y deportiva; pestañas abajo en el teléfono, contenido máx. 760px. Look oscuro fijo, elegido a propósito. */
:root{
  --bg:#120F2A; --surface:#1D1842; --surface2:#28215A; --ink:#F7F5FF; --muted:#ABA5D3; --line:#352D6E;
  --accent:#C8F23C; --accent-ink:#172100; --accent-soft:#2C3A12;
  --hot:#FF5C8A; --hot-soft:#45193A;
  --blue:#4CC9F0; --blue-ink:#01202B; --blue-soft:#143A57; --wood:#FFB547;
  --good:#5BE39A; --warn:#FFD23F; --warn-soft:#3D340E;
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.7rem;line-height:1.05}
h3{font-size:1.25rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:.95;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--accent)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)}
/* Week strip */
.weekbar{display:grid;grid-template-columns:repeat(52,1fr);gap:2px;margin:6px 0 4px}
.weekbar i{height:8px;border-radius:2px;background:var(--line)}
.weekbar i.dl{background:var(--muted);opacity:.55}
.weekbar i.past{background:var(--accent);opacity:.45}
.weekbar i.now{background:var(--accent);opacity:1}
/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{color:var(--good)}
/* Day nav */
.daynav{display:flex;align-items:center;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.datein{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{height:34px;padding:0 12px;font-size:.88rem}
/* Exercise block */
.ex{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ex:first-child{border-top:0;padding-top:0}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exname{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:1.05rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.presc{font-family:var(--f-display);font-weight:700;font-size:1.2rem;white-space:nowrap}
.last{font-size:.85rem;color:var(--muted)}
.field{width:100%;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 10px;min-width:0}
textarea.field{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.set{display:flex;flex-direction:column;gap:2px}
.set label{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.set input{height:44px;text-align:center;font-size:1.15rem;font-weight:600}
.band{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.86rem;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.band b{font-weight:700;color:var(--accent)}
.chip{align-self:flex-start;font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.feel{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.feel button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:.9rem;padding:0}
.feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:12px;border:2px solid var(--accent);background:transparent;font-weight:700;font-size:1.05rem;color:var(--accent);width:100%}
.done[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--f-display);font-size:1.4rem;color:var(--muted)}
details[open] summary::after{content:"–"}
ol.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.rounds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Plan */
.phase{display:flex;flex-direction:column;gap:10px}
.phase.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tmpl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.tmpl b{font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Technique list */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.extile{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px}
.extile svg{width:84px;height:60px;flex:none}
.extile .t{font-weight:600;line-height:1.2}
.extile .c{font-size:.78rem;color:var(--muted)}
/* Sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheetbox{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.figure{background:var(--bg);border-radius:12px;padding:8px}
.figure svg{width:100%;height:auto;display:block;max-height:260px}
.yt{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1}
.tile .l{font-size:.78rem;color:var(--muted);margin-top:4px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:18px;height:18px;border-radius:4px;background:transparent;border:1px solid var(--line)}
.heat i.done{background:var(--accent);border-color:var(--accent)}
.heat i.miss{background:var(--warn-soft);border-color:var(--warn-soft)}
.heat i.rest{border-style:dashed}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heat i.pre{border-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%)}
.form3{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end}
.form3 label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.tablewrap{overflow-x:auto}
table.tests{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
table.tests th,table.tests td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle}
table.tests th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
table.tests input{width:100%;min-width:70px;height:34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 6px}
.entries{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.entries div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}
/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-weight:600;font-size:.8rem;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.brand{font-weight:700;text-transform:none;font-size:1.75rem;line-height:1.02;letter-spacing:0}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display)}
.score .lbl{color:var(--blue);font-weight:700;letter-spacing:.12em;font-size:.95rem}
.score .big{font-size:3.4rem;font-weight:700;color:var(--hot);line-height:.8}
.score .of{color:var(--muted);font-weight:700;font-size:1.2rem}
.band{background:var(--blue-soft);border-color:transparent}
.band b{color:var(--blue)}
.chip{background:var(--blue-soft);color:var(--blue)}
.pill{background:var(--blue-soft)}
.weekbar i.past{background:var(--blue);opacity:.6}
.weekbar i.now{background:var(--accent);opacity:1}
.presc{color:var(--hot)}
.tile .v{color:var(--hot)}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:.74rem}
.figure{background:var(--surface2)}
.alt{color:var(--muted);font-size:.86em}
.meal{display:grid;grid-template-columns:52px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.meal:first-child{border-top:0;padding-top:0}
.meal .tm{font-family:var(--f-display);font-weight:700;color:var(--blue);font-size:1.15rem}
.opts{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.dinner{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.dinner:first-child{border-top:0;padding-top:0}
.taps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.taps button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.taps button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.taps.prot button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.wlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.witem{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;color:var(--ink)}
.witem svg{width:58px;height:42px;flex:none}
.witem .t{font-weight:700;line-height:1.2}
.witem .c{font-size:.8rem;color:var(--muted)}
.start{height:60px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:1.3rem;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.wk{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.wk .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wk h2{font-size:2rem}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.counter{display:grid;grid-template-columns:84px 1fr 84px;align-items:center;gap:10px}
.counter button{height:84px;border-radius:22px;border:0;background:var(--surface2);font-size:2.6rem;font-weight:800;color:var(--ink)}
.counter .val{text-align:center;font-family:var(--f-display);font-size:5.2rem;font-weight:700;line-height:1;color:var(--hot)}
.bigbtn{height:64px;border-radius:18px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;border:0;background:var(--accent);color:var(--accent-ink);width:100%}
.bigbtn.alt2{background:var(--surface2);color:var(--ink)}
.bigbtn.hot{background:var(--hot);color:#2A0012}
.ringwrap{display:grid;place-items:center;position:relative}
.ringwrap svg{width:min(260px,70vw);height:auto}
.ringwrap .rt{position:absolute;font-family:var(--f-display);font-size:4rem;font-weight:700}
.goal{background:var(--hot-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.goal b{color:var(--hot)}
.wk.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{background:var(--bg)}15%,55%{background:var(--accent)}35%,75%{background:var(--hot)}}
.sheet{z-index:40}
.sumrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.92rem}
.cover{border-radius:16px;overflow:hidden;background:var(--surface)}
.cover img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.thumbs figure,.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--bg)}
.thumbs figcaption,.cmp figcaption{font-size:.78rem;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
select.field{appearance:auto}
.toastbox{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.pill.hotp{background:var(--hot-soft);color:var(--hot)}
.musicbtn{flex:none;width:60px;height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);font-size:1.6rem}
.lbl{display:inline-block;min-width:28px;padding:1px 6px;border-radius:6px;background:var(--hot);color:#2A0012;font-family:var(--f-display);font-weight:700;font-size:.85rem;text-align:center}
.exname .lbl{text-decoration:none}
.lvbar{display:flex;gap:3px}
.lvbar i{flex:1;height:10px;border-radius:3px;background:var(--line)}
.lvbar i.y2{opacity:.5}
.lvbar i.got{background:var(--accent);opacity:1}
.lvbar i.cur{background:var(--hot);opacity:1}
ol.lvlist{margin:8px 0 0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
ol.lvlist li>span:last-child{float:right;margin-left:8px}
ol.lvlist li.got{color:var(--accent)}
ol.lvlist li.cur{color:var(--hot);font-weight:700}
.bigclock{font-family:var(--f-display);font-size:3.6rem;font-weight:700;line-height:1}
.small-fig svg{max-height:170px}
nav.tabs .in{grid-template-columns:repeat(6,1fr)}
nav.tabs button{font-size:.68rem}
@media (max-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}.tile .v{font-size:1.5rem}.form3{grid-template-columns:1fr 1fr}.form3 .full{grid-column:1/-1}.brand{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Plan de entrenamiento <span>calistenia</span></div>
      <div class="eyebrow" id="hdrSub" style="margin-top:6px">Fase 1 Base</div>
    </div>
    <div class="score" aria-label="Semana del plan"><span class="lbl">SEM</span><span class="big num" id="scoreWk">01</span><span class="of">/52</span></div>
  </header>
  <div class="status" id="status"><span class="dot" id="statusDot"></span><span id="statusTxt">Conectando…</span></div>
  <div class="weekbar" id="weekbar" aria-hidden="true"></div>
  <main id="view" style="margin-top:14px"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="7" r="3.5"/><circle cx="16" cy="7" r="3.5"/><path d="M8 11v10M16 11v10"/></svg>Hoy</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>Plan</button>
    <button data-tab="trucos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/></svg>Trucos</button>
    <button data-tab="tecnica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 7v7M12 14l-4 7M12 14l4 7M6 10h12"/></svg>Técnica</button>

    if(p<.12)t=0;else if(p<.5)t=(p-.12)/.38;else if(p<.62)t=1;else t=1-(p-.62)/.38;
    t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const P=POSE[key];const J=(P.s.J||P.e.J)?lerpJ(PJ.s,PJ.e,t):fk(lerpSpec(P.s,P.e,t));
    svg.innerHTML=drawFigure(key,J,PJ.s.wrist);RAFS[slot]=requestAnimationFrame(step)};

}

  err:["Encorvar la espalda.","Rodillas por debajo de la cadera."],prog:"Marcha rápida → trote en el lugar.",yt:"rodillas altas ejercicio cardio"},

  err:["Rodilla de apoyo hacia adentro.","Caer con la pierna estirada."],prog:"Paso lateral → pequeño salto → salto más largo.",yt:"skater jumps técnica bajo impacto"},
 gateo_oso:{n:"Gateo de oso",c:"Core",pose:"bear",

 boxeo_sombra:{n:"Boxeo de sombra",c:"Cardio",pose:"box",
  steps:["Guardia: pies separados, uno adelante, puños a la altura de la barbilla.","Lanza golpes rectos alternando brazos, rotando un poco la cadera.","Regresa el puño a la guardia después de cada golpe.","Muévete sobre las puntas, rodillas suaves."],
  err:["Bajar la guardia.","Estirar el codo de golpe hasta trabarlo."],prog:"Directos → combinaciones → agrega sentadillas entre golpes.",yt:"boxeo de sombra para principiantes"},
 step_rapido:{n:"Step-up rápido alternado",c:"Cardio",pose:"step",

 sentadilla_salto:{n:"Sentadilla con salto suave",c:"Cardio",pose:"squatJump",

  err:["Caer con las piernas estiradas.","Rodillas hacia adentro al aterrizar."],prog:"Sin salto → salto bajo → salto más alto.",yt:"sentadilla con salto aterrizaje suave"},
 burpee_paso:{n:"Burpee sin salto",c:"Cardio",pose:"burpee",
  steps:["De pie, baja y pon las manos en el piso.","Lleva un pie atrás y luego el otro hasta quedar en plancha.","Regresa un pie y luego el otro.","Ponte de pie. Fase 3 en adelante: puedes saltar los pies."],
  err:["Cadera hundida en la plancha.","Espalda redondeada al bajar."],prog:"Paso atrás → salto atrás → con flexión.",yt:"burpee sin salto bajo impacto"},
 cuerda:{n:"Saltar la cuerda",c:"Cardio",pose:"rope",

 sentadilla_pared:{n:"Sentadilla en pared",c:"Pierna",pose:"wallSit",

 zancada_atras:{n:"Zancada hacia atrás",c:"Pierna",pose:"lunge",

 sentadilla_sumo:{n:"Sentadilla sumo",c:"Pierna",pose:"squat",

 puente_marcha:{n:"Puente con marcha",c:"Pierna",pose:"bridge1",

 plancha_toque:{n:"Plancha con toque de hombro",c:"Core",pose:"tap",

 rotacion_externa:{n:"Rotación externa con liga",c:"Calentamiento",pose:"extRot",

function weekOf(date){const d=diffDays(date,state.settings.startDate);return Math.floor(d/7)+1}
function suggestedPhase(w){return Math.min(4,Math.max(1,Math.ceil(w/13)))}
function isTestDay(wk){return wk>=4&&wk%4===0&&!DELOAD.includes(wk)&&!TESTW.includes(wk)}
function fmtOf(wk,phase,deload,s){
  if(!s||s.k!=="str")return null;
  if(deload||TESTW.includes(wk)||(phase===1&&wk<=3))return {k:"normal",l:"Series normales"};
  const c=(wk-1)%3,odd=Math.floor((wk-1)/3)%2===1;
  if(c===0)return odd?{k:"tempo",l:"Tempo lento: 4 s bajando"}:{k:"normal",l:"Series normales"};
  if(c===1)return {k:"super",l:"Superseries"};
  return odd?{k:"ladder",l:"Escalera"}:{k:"emom",l:"EMOM"};
}
function dayPlan(date){
  const w=weekOf(date),wk=Math.max(1,w),phase=state.settings.phase||1,dow=parse(date).getDay();
  let key=WEEK[phase][dow];
  if(key==="F"){const odd=wk%2===1;key=(dow===3)?(odd?"p1B":"p1A"):(odd?"p1A":"p1B")}
  if(key==="reto"&&isTestDay(wk))key="pruebas";
  const s=S[key],deload=DELOAD.includes(wk);
  return {date,w,wk,phase,dow,key,s,deload,before:w<1,blk:Math.floor((wk-1)/3),fmt:fmtOf(wk,phase,deload,s)};
}
function setsFor(base,plan){let n=base;if(plan.phase===1&&plan.wk<=2)n=Math.min(n,2);if(plan.deload)n=Math.ceil(n/2);return n}
function topOf(r){const m=String(r).match(/\d+/g);return m?Number(m[m.length-1]):null}

function resolveItems(p){

  const out=(p.s.it||[]).map(x=>{if(Array.isArray(x))return norm(x);if(x.rot)return norm(x.rot[b%x.rot.length]);const o=norm(x.i);if(x.vn){const n=x.vn[b%x.vn.length];if(n&&n!=="Normal")o.note=o.note||n}return o});
  if(prof()==="p2"&&p.phase===1&&(p.key==="p1A"||p.key==="p1B")){const opts=p.key==="p1A"?[["curl_anillas",2,"10–15"],["curl_liga",2,"12–15","curl"],["curl_anillas",2,"10–15",null,"Bajada de 3 s"]]:[["extension_triceps",2,"10–15"],["extension_liga",2,"12–15","tri"],["extension_triceps",2,"10–15",null,"Bajada de 3 s"]];const o=norm(opts[b%3]);o.note=(o.note?o.note+" · ":"")+"Extra de brazos: anillas altas, casi de pie";out.push(o)}
  if(p.fmt&&p.fmt.k==="tempo")out.slice(0,3).forEach(o=>{if(!rng(o.reps).timed)o.note="Baja en 4 s"+(o.note?" · "+o.note:"")});

function emomReps(r){const R=rng(r);if(R.timed)return R.lo+" s";return Math.max(2,Math.round(R.lo*.75))+suffixOf(r)}
function ladderRungs(r){const R=rng(r);if(R.timed)return [.5,.75,1,.75,.5].map(f=>Math.max(5,Math.round(R.lo*f/5)*5));if(R.lo<=4)return [1,2,3,2,1];return [.25,.5,.75,1,.5].map(f=>Math.max(1,Math.round(R.lo*f)))}

function painOn(sk,date){return !!sk.pain&&diffDays(date,sk.pain)<14&&diffDays(date,sk.pain)>=0}

function bindCharts(){
  const ent=[...(state.body.entries||[])].sort((a,b)=>a.date<b.date?-1:1);
  document.querySelectorAll("[data-chart]").forEach(box=>{
    const k=box.dataset.chart,pts=ent.filter(e=>e[k]).map(e=>({d:e.date,v:Number(e[k])}));
    const W=640,H=200,L=44,R=16,T=14,B=28;
    const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const padv=Math.max(1,(hi-lo)*.15);lo=Math.floor(lo-padv);hi=Math.ceil(hi+padv);
    const t0=parse(pts[0].d).getTime(),t1=Math.max(t0+864e5*14,parse(pts[pts.length-1].d).getTime());
    const X=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
    const ticks=[];const step=Math.max(1,Math.ceil((hi-lo)/4));for(let v=lo;v<=hi;v+=step)ticks.push(v);
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k==="w"?"Peso":"Cintura"} en el tiempo">`;
    for(const v of ticks)s+=`<line x1="${L}" x2="${W-R}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${f1(Y(v)+4)}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
    s+=`<text x="${L}" y="${H-8}" font-size="12" fill="var(--muted)">${nice(pts[0].d)}</text>`;
    if(pts.length>1)s+=`<text x="${W-R}" y="${H-8}" font-size="12" text-anchor="end" fill="var(--muted)">${nice(pts[pts.length-1].d)}</text>`;
    const path=pts.map((p,i)=>(i?"L":"M")+f1(X(p.d))+","+f1(Y(p.v))).join(" ");
    if(pts.length>1)s+=`<path d="${path} L${f1(X(pts[pts.length-1].d))},${H-B} L${f1(X(pts[0].d))},${H-B} Z" fill="var(--accent)" opacity=".10"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle cx="${f1(X(p.d))}" cy="${f1(Y(p.v))}" r="${last?6:4.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`});
    const lp=pts[pts.length-1];s+=`<text x="${f1(Math.min(W-R-4,X(lp.d)))}" y="${f1(Y(lp.v)-12)}" text-anchor="end" font-size="13" font-weight="600" fill="var(--ink)">${lp.v}</text>`;
    s+=`</svg><div class="tip" hidden></div>`;box.innerHTML=s;
    const svg=box.querySelector("svg"),tip=box.querySelector(".tip");
    const move=ev=>{const r=svg.getBoundingClientRect();const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;const sx=cx/r.width*W;let best=pts[0];for(const p of pts)if(Math.abs(X(p.d)-sx)<Math.abs(X(best.d)-sx))best=p;
      tip.hidden=false;tip.textContent=niceY(best.d)+": "+best.v+(k==="w"?" kg":" cm");tip.style.left=(X(best.d)/W*r.width)+"px";tip.style.top=(Y(best.v)/H*r.height)+"px"};
    svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",()=>tip.hidden=true);
  });
}

      else its.forEach((it,ei)=>{const n=setsFor(it.sets,p);for(let j=0;j<n;j++)steps.push({k:"set",ns:"ex",id:it.id,ei,j,n,reps:it.reps,bk:it.bk,note:it.note,rest:p.phase===1?75:(ei<2?120:90),grp:"Ejercicio",gn:its.length})})}

    else if(pt.t==="circ"){for(let r=0;r<pt.rounds;r++)pt.items.forEach((it,ei)=>steps.push({k:"cw",id:it.id,ei,r,rounds:pt.rounds,n:pt.items.length,reps:it.reps,bk:it.bk,note:it.note,rest:pt.rest,rrest:pt.rrest,last:ei===pt.items.length-1,name:pt.name,rk:pt.key}))}

  });

}

  if(a==="wustart"){W.autoWu=true;W.work={end:Date.now()+st.sec*1000,total:st.sec};renderW();announce();return}
  if(a==="pause"){if(!W.work)return;if(W.work.paused!=null){W.work.end=Date.now()+W.work.paused*1000;W.work.paused=null}else{W.work.paused=Math.max(0,(W.work.end-Date.now())/1000)}renderW();return}
  if(a==="skiplist"){let j=W.i;while(W.steps[j]&&W.steps[j].k==="wu"&&W.steps[j].list===st.list)j++;go(j);return}
  if(a==="clearset"){const x=stepLog(st);if(x.r)x.r[st.j]="";save("log-"+W.d);enterStep();renderW();return}
  if(a==="cwstart"){W.auto=true;const R=rng(st.reps);W.work={end:Date.now()+R.hi*1000,total:R.hi};renderW();say("Adelante. "+R.hi+" segundos.");return}
  if(a==="cwdone"){W.auto=true;finishCw();return}
  if(a==="optyes"){go(W.i+1);return}
  if(a==="optno"){let j=W.i+1;while(W.steps[j]&&W.steps[j].opt)j++;say("Va. Pasamos a estirar.");go(j);return}
  if(a==="pstart"){pStart();return}
  if(a==="ppause"){const pt=W.pt;if(pt.pausedAt){pt.t0+=Date.now()-pt.pausedAt;pt.pausedAt=null;say("Seguimos.")}else{pt.pausedAt=Date.now();say("Pausa.")}renderW();return}
  if(a==="pend"){pEnd();return}
  if(a==="pnext"){go(W.i+1);return}
  if(a==="pagain"){W.pt={i:W.i,st:0};renderW();return}
  if(a==="ptask"){const pt=W.pt,P=st.P;pt.ti++;beep(1);if(pt.ti>=P.seq.length){finishProto({v:Math.round(pEl())});return}const [id,d]=P.seq[pt.ti];say(d+" "+EX[id].n+".");renderW();return}
  if(a==="pplus"){W.pt.rounds++;say("Van "+W.pt.rounds+".");renderW();return}
  if(a==="pminus"){W.pt.rounds=Math.max(0,W.pt.rounds-1);renderW();return}
  if(a==="pfail"){finishProto({v:W.pt.m||0});return}
  if(a==="phold"){pHold();return}
  if(a==="tok"||a==="tno"){const r=recordAttempt(st.br,a==="tok",W.d),m=attemptMsg(r,st.br);W.tmsg[st.br]=m;if(r==="unlock"){beep(3);flash()}say(m);renderW();return}
  if(a==="tpain"){const sk=skState(null,st.br);sk.pain=W.d;save("skills",true);W.tmsg[st.br]="Anotado. Las próximas 2 semanas practicas el nivel anterior, sin intentos.";say(W.tmsg[st.br]);renderW();return}
  if(a==="feel"){const l=getLog(W.d);const v=Number(b.dataset.v);l.feel=l.feel===v?null:v;save("log-"+W.d);renderW();return}
  if(a==="finish"){if(sumMissing().length){W.sumErr=true;renderW();say("Te faltan series por anotar.");return}const l=getLog(W.d);l.done=true;l.plan=W.p.key;save("log-"+W.d,true);clearInterval(W.tick);W=null;const el=document.getElementById("wk");if(el)el.hidden=true;document.body.style.overflow="";render();return}
}
/* Música */
function musicKey(p){return p.s.k==="circ"?"cardio":(p.s.k==="reto"||p.s.k==="test")?"reto":"fuerza"}
function openMusic(k){const mu=state.settings.music||{};const url=mu[k]||mu.fuerza||mu.cardio||mu.reto;
  if(!url){toast("Pega el enlace de tu playlist en Plan → Música.");try{window.open("https://music.youtube.com/","_blank","noopener")}catch(e){}return}
  try{window.open(url,"_blank","noopener")}catch(e){location.href=url}}


/* ============ EVENTOS ============ */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;ui.tab=b.dataset.tab;try{localStorage.setItem("ba_ui",JSON.stringify({tab:ui.tab}))}catch(_){}render();window.scrollTo(0,0)});
document.getElementById("sheetRoot").addEventListener("click",e=>{if(e.target.closest('[data-act="close"]'))closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const view=document.getElementById("view");
const exLog=(l,ns,id)=>{l[ns]=l[ns]||{};return l[ns][id]=l[ns][id]||{r:[]}};
view.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-ex]");if(!t)return;
  if(t.dataset.ex){openSheet(t.dataset.ex);return}
  const a=t.dataset.act;const d=ui.date;
  if(a==="prev"){ui.date=addDays(d,-1);ui.menuW=null;render();return}
  if(a==="next"){ui.date=addDays(d,1);ui.menuW=null;render();return}
  if(a==="today"){ui.date=today();render();return}
  if(a==="testVoice"){initAudio();testVoice();return}
  if(a==="music"){openMusic(musicKey(dayPlan(d)));return}
  if(a==="backup"){backup();return}
  if(a==="doRestore"){const d=ui.restore;ui.restore=null;if(d.photos)restorePhotos(d.photos);for(const [k,v] of Object.entries(d.slots)){try{localStorage.setItem(KEY(k),JSON.stringify(normalize(v,k)))}catch(e){}}const sl=d.slots[state.slot]?state.slot:(d.active||Object.keys(d.slots)[0]);activeSlot=null;switchSlot(sl);toast("Respaldo restaurado.");return}
  if(a==="cancelRestore"){ui.restore=null;render();return}
  if(a==="shareWeek"){shareWeek();return}
  if(a==="delCover"){IDB.del("cover").then(()=>{toast("Foto de portada quitada.")});return}
  if(a==="showPhotos"){ui.showPhotos=true;fillPhotos();return}
  if(a==="hidePhotos"){ui.showPhotos=false;fillPhotos();return}
  if(t.dataset.cmppose){ui.cmpPose=t.dataset.cmppose;fillPhotos();return}
  if(t.dataset.delphoto){if(ui.confirmDel!==t.dataset.delphoto){ui.confirmDel=t.dataset.delphoto;t.textContent="¿Seguro? Toca otra vez";return}ui.confirmDel=null;IDB.del(t.dataset.delphoto).then(fillPhotos);return}
  if(a==="viewMine"){ui.viewPartner=false;render();return}
  if(a==="viewPartner"){ui.viewPartner=true;render();return}
  if(a==="startW"){startWorkout();return}
  if(a==="guideWarm"){startWorkout("warm");return}
  if(a==="guideCool"){startWorkout("cool");return}
  if(a==="gotrucos"){ui.tab="trucos";render();window.scrollTo(0,0);return}
  if(a==="allPR"){ui.allPR=!ui.allPR;render();return}
  if(t.dataset.menuw!=null){ui.menuW=Number(t.dataset.menuw);render();return}
  if(t.dataset.att){const r=recordAttempt(t.dataset.att,t.dataset.ok==="1",today());toast(attemptMsg(r,t.dataset.att));return}
  if(t.dataset.pain){const sk=skState(null,t.dataset.pain);sk.pain=today();save("skills",true);toast("Anotado. Las próximas 2 semanas practica el nivel anterior y no hagas intentos.");return}
  if(t.dataset.painoff){skState(null,t.dataset.painoff).pain=null;save("skills",true);render();return}
  if(t.dataset.undoatt){if(ui.confirmUndo!==t.dataset.undoatt){ui.confirmUndo=t.dataset.undoatt;t.textContent="¿Seguro? Toca otra vez";return}ui.confirmUndo=null;undoAttempt(t.dataset.undoatt);render();return}
  if(t.dataset.protodone){const l=getLog(d);l.proto=l.proto||{};const k=t.dataset.protodone;if(l.proto[k])delete l.proto[k];else l.proto[k]={type:t.dataset.ptype,v:1};save("log-"+d,true);render();return}
  if(t.dataset.clearex){const l=getLog(d),ns=t.dataset.ns||"ex";if(l[ns])delete l[ns][t.dataset.clearex];save("log-"+d,true);render();return}
  if(a==="goprog"){ui.tab="progreso";render();window.scrollTo(0,0);return}
  if(a==="done"){const l=getLog(d);l.done=!l.done;l.plan=dayPlan(d).key;save("log-"+d,true);render();return}
  if(t.dataset.feel){const l=getLog(d);const n=Number(t.dataset.feel);l.feel=l.feel===n?null:n;save("log-"+d);render();return}
  if(t.dataset.round!=null){const l=getLog(d);l.rounds=l.rounds||[];const i=Number(t.dataset.round);l.rounds[i]=!l.rounds[i];for(let j=0;j<l.rounds.length;j++)l.rounds[j]=!!l.rounds[j];save("log-"+d);render();return}
  if(t.dataset.prof){switchSlot(t.dataset.prof);return}
  if(t.dataset.fp!=null||t.dataset.fa!=null||t.dataset.fv!=null){const l=getLog(d);l.food=l.food||{};const k=t.dataset.fp!=null?"p":t.dataset.fa!=null?"a":"v";const i=Number(t.dataset.fp??t.dataset.fa??t.dataset.fv);const arr=Array.isArray(l.food[k])?l.food[k].slice():[];arr[i]=!arr[i];for(let j=0;j<arr.length;j++)arr[j]=!!arr[j];l.food[k]=arr;save("log-"+d);render();return}
  if(t.dataset.phase){state.settings.phase=Number(t.dataset.phase);save("settings",true);render();return}
  if(t.dataset.cat){ui.cat=t.dataset.cat;render();return}
  if(a==="addBody"){const date=document.getElementById("bDate").value,w=parseFloat(document.getElementById("bW").value),c=parseFloat(document.getElementById("bC").value);
    if(!date||(isNaN(w)&&isNaN(c)))return;const list=(state.body.entries||[]).filter(x=>x.date!==date);list.push({date,w:isNaN(w)?null:w,c:isNaN(c)?null:c});state.body.entries=list;save("body",true);render();return}
  if(t.dataset.delbody){state.body.entries=(state.body.entries||[]).filter(x=>x.date!==t.dataset.delbody);save("body",true);render();return}
});
function parseRes(type,v){v=String(v).trim();if(!v)return null;if(type==="fortime"){const m=v.match(/^(\d+)[:.](\d{1,2})$/);if(m)return Number(m[1])*60+Number(m[2]);const n=parseFloat(v);return isNaN(n)?null:Math.round(n*60)}const n=parseFloat(v);return isNaN(n)?null:n}
view.addEventListener("input",e=>{
  const t=e.target,d=ui.date;
  if(t.dataset.exV){const x=exLog(getLog(d),t.dataset.ns||"ex",t.dataset.exV);x.v=t.value;save("log-"+d);return}
  if(t.dataset.exR){const ns=t.dataset.ns||"ex",id=t.dataset.exR,x=exLog(getLog(d),ns,id);if(x.v==null){const vi=document.getElementById("v-"+ns+"-"+id);if(vi&&vi.value)x.v=vi.value}if(t.dataset.u)x.u=t.dataset.u;if(t.dataset.fmt)x.fmt=t.dataset.fmt;x.r=x.r||[];x.r[Number(t.dataset.i)]=t.value;for(let j=0;j<x.r.length;j++)if(x.r[j]==null)x.r[j]="";save("log-"+d);return}
  if(t.dataset.f==="note"||t.dataset.f==="libre"){const l=getLog(d);l[t.dataset.f]=t.value;save("log-"+d);return}
  if(t.dataset.proto){const l=getLog(d);l.proto=l.proto||{};const v=parseRes(t.dataset.ptype,t.value);if(v==null)delete l.proto[t.dataset.proto];else{const r={type:t.dataset.ptype,v};if(t.dataset.rid)r.rid=t.dataset.rid;l.proto[t.dataset.proto]=r}save("log-"+d);return}
  if(t.dataset.music){state.settings.music=state.settings.music||{};state.settings.music[t.dataset.music]=t.value.trim();save("settings");return}
  if(t.id==="pname"){state.settings.name=t.value;save("settings");renderHeader();return}
  if(t.id==="ppname"){state.settings.partnerName=t.value;save("settings");return}
  if(t.dataset.test){const c=t.dataset.test;state.tests[c]=state.tests[c]||{};state.tests[c][t.dataset.k]=t.value;save("tests");return}
  if(t.id==="texq"){ui.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById("texq");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}return}
});
view.addEventListener("change",e=>{
  const t=e.target,d=ui.date;
  if(t.id==="coverFile"){const f=t.files&&t.files[0];t.value="";if(f)setCover(f).then(()=>render());return}
  if(t.id==="phFile"){const f=t.files&&t.files[0];t.value="";if(f)addPhoto(f).then(()=>render());return}
  if(t.id==="cmpA"){ui.cmpA=t.value;fillPhotos();return}
  if(t.id==="cmpB"){ui.cmpB=t.value;fillPhotos();return}
  if(t.id==="restoreFile"){readFile(t,d=>{ui.restore=d;render()});return}
  if(t.id==="partnerFile"){readFile(t,d=>{loadPartner(d);render()});return}
  if(t.id==="dateSel"&&t.value){ui.date=t.value;render();return}
  if(t.id==="startDate"&&t.value){state.settings.startDate=t.value;save("settings",true);render();return}
  if(t.dataset.proto){render();return}
  if(t.dataset.ft){const l=getLog(d);l.food=l.food||{};l.food[t.dataset.ft]=t.checked;save("log-"+d);return}
  if(t.dataset.f==="warm"||t.dataset.f==="cool"){const l=getLog(d);l[t.dataset.f]=t.checked;save("log-"+d);render();return}
  if(t.dataset.crit){const n=t.dataset.crit;const arr=(state.settings.criteria[n]||[]).slice();arr[Number(t.dataset.j)]=t.checked;for(let j=0;j<arr.length;j++)arr[j]=!!arr[j];state.settings.criteria[n]=arr;save("settings",true);render();return}
});

initStore();
